name: Build glcn

# Builds the glcn fork: this app + the forked core (carlosglcn/OwnTV-Fanart-Core at the commit pinned
# in glcn/core.ref), as a signed release APK with its own package id (tv.own.owntv.glcn) so it
# installs next to the official OwnTV.
#
# Output:
#   - Release "glcn-latest" with OwnTV-Fanart.apk  →
#     https://github.com/carlosglcn/OwnTV-Fanart/releases/download/glcn-latest/OwnTV-Fanart.apk
#   - Branch "ci-status": status.txt + build.log (last lines), so the result can be read with git.
on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glcn-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Read core pin
        id: pin
        run: echo "ref=$(tr -d '[:space:]' < glcn/core.ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout core fork
        uses: actions/checkout@v4
        with:
          repository: carlosglcn/OwnTV-Fanart-Core
          ref: ${{ steps.pin.outputs.ref }}
          path: core-src

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK (arm)
        id: build
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/glcn/glcn.keystore
          KEYSTORE_PASSWORD: owntvglcn
          KEY_ALIAS: glcn
          KEY_PASSWORD: owntvglcn
        run: |
          chmod +x ./gradlew
          set -o pipefail
          # Rising version for the in-app updater: name 2026.1014.<run>, code 100000+<run>
          # (both above the 99.99.99 / 99999 of the first builds, so those update too).
          export VERSION_NAME="$(date -u +%Y).$(date -u +%m%d).${GITHUB_RUN_NUMBER}"
          export VERSION_CODE="$((100000 + GITHUB_RUN_NUMBER))"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          ./gradlew :app:assembleStandardRelease \
            -Powntv.corePath="$GITHUB_WORKSPACE/core-src" \
            -Pglcn.appIdSuffix=${{ github.ref == 'refs/heads/dev' && '.glcn.beta' || '.glcn' }} \
            -Pglcn.beta=${{ github.ref == 'refs/heads/dev' }} \
            --stacktrace --console=plain 2>&1 | tee build.log

      # glcn: the compiler's errors, readable from git when a build fails (branch ci-status, file dev.log).
      - name: Publish build errors
        if: failure() && steps.build.conclusion == 'failure'
        run: |
          mkdir -p /tmp/cis && cd /tmp/cis
          git init -q . && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin ci-status && git checkout -q -b ci-status FETCH_HEAD || git checkout -q --orphan ci-status
          { echo "run=${{ github.run_id }} sha=${{ github.sha }}"; grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Unresolved|Could not" -A2 "$GITHUB_WORKSPACE/build.log" | head -120; } > "${{ github.ref_name }}.log" || true
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -q -m "build errors ${{ github.sha }}" && git push -q origin ci-status || true

      - name: Package APK
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/standard/release/*.apk | head -1)
          mkdir -p dist && cp "$APK" dist/OwnTV-Fanart.apk
          ls -la dist

      # glcn: the R8 mapping of every build, kept 90 days, so a crash report's obfuscated lines can be read back.
      - name: Keep R8 mapping
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ env.VERSION_NAME }}
          path: app/build/outputs/mapping/**/mapping.txt
          retention-days: 90
          if-no-files-found: ignore

      # glcn: every push is built and checked, but a version is only published when asked:
      # a commit whose message carries [release], or a manual run. The notes come from
      # glcn/RELEASE_NOTES.md, which the in-app updater shows.
      - name: Publish releases
        if: success() && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="Build ${GITHUB_SHA::7} — core $(tr -d '[:space:]' < glcn/core.ref | cut -c1-7)"
          if [ -s glcn/RELEASE_NOTES.md ]; then NOTES="$(cat glcn/RELEASE_NOTES.md)"$'\n\n'"$NOTES"; fi
          # Versioned release: what the in-app updater reads (releases/latest).
          gh release create "v$VERSION_NAME" dist/OwnTV-Fanart.apk \
            --title "OwnTV Fanart $VERSION_NAME" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          # Fixed link for Downloader, kept as a pre-release so it is never "latest".
          gh release delete glcn-latest --yes --cleanup-tag || true
          gh release create glcn-latest dist/OwnTV-Fanart.apk \
            --title "OwnTV Fanart (enlace fijo)" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          # Keep the three newest versioned releases.
          gh release list --limit 100 --json tagName,createdAt --jq 'map(select(.tagName|startswith("v")))|sort_by(.createdAt)|reverse|.[3:]|.[].tagName' \
            | while read -r t; do gh release delete "$t" --yes --cleanup-tag || true; done

      # glcn: the dev branch is the beta — every push publishes it, but only to the PRIVATE repository
      # carlosglcn/OwnTV-Fanart-Beta (tag beta-tv), so nobody else can see or download it. The beta app
      # reads that tag with a read-only token pasted once in About. BETA_PUBLISH_TOKEN is a fine-grained
      # token limited to that repository (Contents: read and write).
      - name: Publish beta (private)
        if: success() && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.BETA_PUBLISH_TOKEN }}
          BETA_REPO: carlosglcn/OwnTV-Fanart-Beta
          BETA_TAG: beta-tv
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Missing secret BETA_PUBLISH_TOKEN"; exit 1; fi
          cp dist/OwnTV-Fanart.apk dist/OwnTV-Fanart-Beta.apk
          NOTES="Beta ${GITHUB_SHA::7} — core $(tr -d '[:space:]' < glcn/core.ref | cut -c1-7)"
          if [ -s glcn/BETA_NOTES.md ]; then NOTES="$(cat glcn/BETA_NOTES.md)"$'\n\n'"$NOTES"; fi
          # A release needs a commit to hang its tag on: give the empty repository its first one.
          if ! gh api "repos/$BETA_REPO/commits?per_page=1" >/dev/null 2>&1; then
            gh api -X PUT "repos/$BETA_REPO/contents/README.md" -f message="init" \
              -f content="$(printf '# OwnTV Fanart Beta\n\nPrivate test builds.\n' | base64 -w0)" >/dev/null || true
          fi
          gh release delete "$BETA_TAG" -R "$BETA_REPO" --yes --cleanup-tag || true
          gh release create "$BETA_TAG" dist/OwnTV-Fanart-Beta.apk -R "$BETA_REPO" \
            --title "OwnTV Fanart Beta $VERSION_NAME" --notes "$NOTES" --prerelease

      - name: Report status to ci-status branch
        if: always()
        run: |
          STATUS="${{ steps.build.outcome }}"
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q && git checkout -q -b "${{ github.ref == 'refs/heads/dev' && 'ci-status-dev' || 'ci-status' }}"
          {
            echo "status=$STATUS"
            echo "app=$GITHUB_SHA"
            echo "core=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/glcn/core.ref")"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > status.txt
          if [ -f "$GITHUB_WORKSPACE/build.log" ]; then
            grep -nE '^e: |error:|FAILED|What went wrong' -A3 "$GITHUB_WORKSPACE/build.log" | head -400 > errors.txt || true
            tail -n 400 "$GITHUB_WORKSPACE/build.log" > build.log
          fi
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -q -m "ci $STATUS ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY" "${{ github.ref == 'refs/heads/dev' && 'ci-status-dev' || 'ci-status' }}"
